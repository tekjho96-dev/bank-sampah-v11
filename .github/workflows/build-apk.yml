name: Build Bank Sampah V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract V11 package
        run: |
          mkdir -p v11
          unzip -o Bank_Sampah_V11_Cloud_Build.zip -d v11

          INNER_ZIP=$(find v11 -name "Bank_Sampah_V11_APK_Android.zip" -type f | head -1)

          if [ -z "$INNER_ZIP" ]; then
            echo "ZIP Android V11 tidak ditemukan"
            find v11 -type f
            exit 1
          fi

          mkdir -p v11/project
          unzip -o "$INNER_ZIP" -d v11/project

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          SETTINGS=$(find v11/project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "Project Android tidak ditemukan"
            find v11/project -maxdepth 4 -type f
            exit 1
          fi

          echo "Project ditemukan:"
          dirname "$SETTINGS"
          
      - name: Build APK
        run: |
           SETTINGS=$(find v11/project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
           PROJECT_DIR=$(dirname "$SETTINGS")

           echo "Building dari: $PROJECT_DIR"
           cd "$PROJECT_DIR"

         
           touch gradle.properties
           echo "android.useAndroidX=true" >> gradle.properties
           echo "android.enableJetifier=true" >> gradle.properties

           echo "Isi gradle.properties:"
           cat gradle.properties

           gradle assembleDebug --no-daemon

      

      - name: Find APK
        run: |
           find v11 -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
         name: Bank-Sampah-V11-APK          
         path: |
          v11/**/*.apk
