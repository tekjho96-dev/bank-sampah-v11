name: Build Bank Sampah V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V11 package
        run: |
          rm -rf work
          mkdir -p work
          unzip -q Bank_Sampah_V11_Cloud_Build.zip -d work
          unzip -q work/v11cloud/Bank_Sampah_V11_APK_Android.zip -d work/android

      - name: Build APK
        working-directory: work/android/Bank_Sampah_V11_APK_Android
        run: |
          gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp work/android/Bank_Sampah_V11_APK_Android/app/build/outputs/apk/debug/app-debug.apk output/Bank-Sampah-V11.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bank-Sampah-V11-APK
          path: output/Bank-Sampah-V11.apk
          if-no-files-found: error
