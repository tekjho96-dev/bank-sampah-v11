name: Build Bank Sampah V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V11 package
        run: |
          mkdir -p v11
          unzip -o Bank_Sampah_V11_Cloud_Build.zip -d v11

      - name: Find Android project
        run: |
          find v11 -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find v11 -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find v11 -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bank-Sampah-V11-APK
          path: |
            v11/**/*.apk
